version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      expo:
        patterns:
          - "expo*"
          - "@expo*"
      react-native:
        patterns:
          - "react-native*"
          - "@react-native*"
          - "@react-navigation*"
      dev-dependencies:
        dependency-type: "development"
